<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/jspsych@7.3.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.1.2"></script>
  <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css">
</head>
<body></body>
<script>
  // 1. jsPsychインスタンスの作成
  const jsPsych = initJsPsych();

  // 2. 画像リスト
  const experiment_list = [
    { image: "face1.png", prompt: "この人物は公正な人物である" },
    { image: "face1.png", prompt: "この人物は誠実な人物である" },
    { image: "face1.png", prompt: "この人物は信頼できる人物である" },
    { image: "face1.png", prompt: "この人物は親切な人物である" },
    { image: "face1.png", prompt: "この人物は忠誠心のある人物である" },
    { image: "face2.png", prompt: "この人物は公正な人物である" },
    { image: "face2.png", prompt: "この人物は誠実な人物である" },
    { image: "face2.png", prompt: "この人物は信頼できる人物である" },
    { image: "face2.png", prompt: "この人物は親切な人物である" },
    { image: "face2.png", prompt: "この人物は忠誠心のある人物である" }
  ];

  let timeline = [];

  experiment_list.forEach(item => {
    // 3. 画像提示
    timeline.push({
      type: jsPsychModuleImageKeyboardResponse, // 修正箇所：プラグインの参照方法をより明確に
      stimulus: item.image,
      choices: "NO_KEYS",
      trial_duration: 3000
    });

    // 4. スライダー付き設問
    timeline.push({
      type: jsPsychModuleSurveyHtmlForm, // 修正箇所
      preamble: `<p><strong>${item.prompt}</strong></p>`,
      html: `
        <div style="width:300px; margin:auto;">
          <input type="range" name="vas" value="50" min="0" max="100" style="width:100%;">
          <div style="display:flex; justify-content:space-between;">
            <span>0<br>全く当てはまらない</span>
            <span>100<br>よく当てはまる</span>
          </div>
        </div>
      `,
      button_label: '次へ'
    });
  });

  // jsPsych7系でのプラグイン変数名へのエイリアス設定
  const jsPsychModuleImageKeyboardResponse = jsPsychImageKeyboardResponse;
  const jsPsychModuleSurveyHtmlForm = jsPsychSurveyHtmlForm;

  jsPsych.run(timeline);
</script>
</html>
